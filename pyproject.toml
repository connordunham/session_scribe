[project]
name = "session-scribe"
version = "0.1.0"
description = "Offline D&D session recorder, transcriber and session-log drafter"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pyyaml>=6",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Kept optional so the API, tests and review screen run on machines without a
# GPU stack; the worker needs it to transcribe.
stt = ["faster-whisper>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
scribe = "scribe.cli:main"

[tool.setuptools.packages.find]
include = ["scribe*"]

[tool.setuptools.package-data]
scribe = ["static/*", "default_profiles.yaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
