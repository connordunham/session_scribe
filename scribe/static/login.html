<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session Scribe</title><link rel="stylesheet" href="/app.css"></head><body>
<main style="max-width:360px"><div class="card"><h2>Session Scribe login</h2>
<form id="f" class="row"><input type="password" id="pw" placeholder="Password" autofocus required><button class="primary">Log in</button></form>
<p id="msg" class="bad"></p></div></main>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password: document.getElementById('pw').value})});
  if (r.ok) location.href = '/index.html'; else document.getElementById('msg').textContent = 'Wrong password.';
};
</script></body></html>
